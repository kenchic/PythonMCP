services:
  code:
    build: .
    container_name: python-vscode
    environment:
      - PASSWORD=miclave123  # Puedes cambiarla
    ports:
      - "8443:8080"
    volumes:
      - ./data:/home/coder/project     # Aquí irá tu proyecto y cambios
      - ./vscode:/home/coder/.local/share/code-server  # Persistencia de config/extensions
    restart: unless-stopped